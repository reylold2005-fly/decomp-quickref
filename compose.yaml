services:
  decomp-quickref:
    image: python:3.11-slim
    container_name: decomp-quickref
    restart: unless-stopped
    working_dir: /site
    command: ["python", "-m", "http.server", "80", "--bind", "0.0.0.0"]
    ports:
      - "127.0.0.1:8082:80"
    volumes:
      - ".:/site:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1/', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
